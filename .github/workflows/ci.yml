# The governor's own CI. It gates itself with the build from this PR, so a change that
# breaks `gate ci` fails here rather than in a client repo.
#
# pull_request only: `gate ci` diffs against GITHUB_BASE_REF, which other events leave
# empty — it would then fall back to `main` and check almost nothing.
#
# The hooks are the first line of defence, but they are local and, by design, skip on a
# machine without the governor installed. This job is the one that always runs.
name: ci
on:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gate ci needs a merge-base with the PR's base
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv-py && .venv-py/bin/pip install "pytest>=8" pytest-timeout "mutmut>=3.8,<4"
      - run: npm test
      # red-before-green is skipped in CI (it needs the local ledger); this runs green,
      # diff-audit and, when enabled in .governor/config.json, mutation.
      - name: Gate
        run: node dist/cli.js gate ci

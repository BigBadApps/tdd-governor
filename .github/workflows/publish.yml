# Publishes to npm when a GitHub release is published. The first release of a package must be
# published by hand (`npm publish`); after that, add this repository as a trusted publisher on
# npmjs.com (package Settings > Trusted Publisher, workflow filename: publish.yml) and releases
# publish from here with provenance and no stored token.
name: publish
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish

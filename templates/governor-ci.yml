# Copy to .github/workflows/governor.yml in a client repo.
#
# Setup:
#   1. Replace GOVERNOR_SHA below with a tdd-governor commit that includes `gate ci`.
#   2. Nothing to add to vitest.config.ts: the governor passes its own reporter. If the
#      config imports 'tdd-governor/vitest-reporter', keep tdd-governor in devDependencies
#      so `npm ci` can resolve it.
#   3. To make the check block merges, require "governor / gate" in branch protection
#      and protect .github/workflows/.
#   4. The client needs Stryker installed and configured (`@stryker-mutator/core`,
#      `@stryker-mutator/vitest-runner`, a `stryker.config.json`), or
#      `mutation.enabled: false` in `.governor/config.json`; otherwise the mutation
#      gate reports GATE_UNAVAILABLE and every PR fails.
#
# Trigger is pull_request only: GITHUB_BASE_REF is empty on other events, so `gate ci`
# would fall back to `main` and diff almost nothing. Do not add other triggers without
# passing --base.
name: governor
on:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and build the governor
        run: |
          git clone --quiet https://github.com/BigBadApps/tdd-governor.git "$RUNNER_TEMP/governor"
          git -C "$RUNNER_TEMP/governor" checkout --quiet GOVERNOR_SHA
          npm ci --prefix "$RUNNER_TEMP/governor"
          npm run build --prefix "$RUNNER_TEMP/governor"
      - run: npm ci
      - name: Gate
        env:
          GOVERNOR_HOME: ${{ runner.temp }}/governor
        run: node "$GOVERNOR_HOME/dist/cli.js" gate ci
